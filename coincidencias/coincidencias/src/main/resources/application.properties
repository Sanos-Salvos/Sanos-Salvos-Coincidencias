
server.port=8084
spring.application.name=coincidencias-service

spring.datasource.url=jdbc:postgresql://localhost:5432/coincidencias_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=coincidencias-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
resilience4j.circuitbreaker.instances.coincidenciasCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.coincidenciasCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.coincidenciasCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.coincidenciasCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.coincidenciasCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.coincidenciasCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.coincidenciasCB.failureRateThreshold=50

app.jwt.secret=sanosysalvos1234